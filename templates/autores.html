{% extends "base.html" %}

{% block title %}Autores - Sistema de Biblioteca{% endblock %}

{% block conteudo %}

<h2>Cadastro de Autores</h2>

<form method="POST">
    <input type="text" name="nome" placeholder="Nome do autor" required>

    <input type="text" name="nacionalidade" placeholder="Nacionalidade">

    <button type="submit">Cadastrar</button>
</form>

<h2>Autores cadastrados</h2>

<ul>
    {% for autor in autores %}
        <li>{{ autor.nome }} - {{ autor.nacionalidade }}</li>
    {% endfor %}
</ul>

{% endblock %}
